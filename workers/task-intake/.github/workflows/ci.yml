name: Task Intake Worker CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Worker types
        run: npm run cf-typegen
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: typecheck-log
          path: typecheck.log
      - name: Test
        run: npm test
      - name: Build Worker
        run: npx wrangler deploy --dry-run
