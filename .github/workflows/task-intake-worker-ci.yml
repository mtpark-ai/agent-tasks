name: Task Intake Worker CI

on:
  push:
    paths:
      - "workers/task-intake/**"
      - ".github/workflows/task-intake-worker-ci.yml"
  pull_request:
    paths:
      - "workers/task-intake/**"
      - ".github/workflows/task-intake-worker-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/task-intake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/task-intake/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Worker types
        run: npm run cf-typegen
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: typecheck-log
          path: workers/task-intake/typecheck.log
      - name: Test
        run: npm test 2>&1 | tee test.log
      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-log
          path: workers/task-intake/test.log
      - name: Build Worker
        run: npx wrangler deploy --dry-run
